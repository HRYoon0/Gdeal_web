/* 자료공유 전용 소량 스타일 (나머지는 growth.css g- 클래스) */
.r-card{display:flex;flex-direction:column;gap:.5rem;transition:box-shadow .3s,border-color .3s}
.r-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem}
.r-card-title{font-weight:700;font-size:1.05rem;color:#111827;word-break:break-word}
.r-desc{font-size:.88rem;color:#4b5563;line-height:1.55;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.r-card-foot{margin-top:auto;display:flex;flex-direction:column;gap:.5rem}
.r-meta{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;color:#5f5f66;gap:.5rem}
.r-thumb{border-radius:.5rem;overflow:hidden;background:#f0f9f3;aspect-ratio:16/9;max-width:100%}
.r-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.r-highlight{border-color:#66ae7d;box-shadow:0 0 20px rgba(102,174,125,.5)}
.r-tagchip{font-size:.78rem;padding:.2rem .55rem}
.r-preview{border:1px solid #e5e7eb;border-radius:.6rem;overflow:hidden;background:#fff}
.r-preview-bar{background:#f9fafb;border-bottom:1px solid #e5e7eb;padding:.45rem .8rem;font-size:.8rem;color:#5f5f66;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-preview iframe{width:100%;height:500px;border:0;display:block}
.r-preview-box{padding:1.5rem;text-align:center;background:#f0f9f3}
.r-preview-box h4{font-size:1.15rem;font-weight:700;color:#111827;margin-bottom:.4rem}
.r-webapp{display:none}
.r-webapp.open{display:block}
@media screen and (max-width:768px){.r-preview iframe{height:360px}}
